name: Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests with pytest
        run: pytest tests/ -v --tb=short --color=yes
        env:
          PYTEST_GITHUB_ACTIONS_ANNOTATE: "true"

  lint:
    name: Ruff Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Ruff lint check
        uses: astral-sh/ruff-action@v1
        with:
          args: check --extend-select I . --output-format=github

      - name: Run Ruff format check
        uses: astral-sh/ruff-action@v1
        with:
          args: format --check .

