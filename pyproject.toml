[project]
name = "migration_tool"
dynamic = ["version"]
description = "Migration tool package, used in EFRAG's Digital Converter"
authors = [ 
    { name = "Andrea Baschiera", email = "andrea.baschiera@efrag.org" }, 
    {name = "Thibault Magro", email = "thibault.magro@efrag.org"}
    ]
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "openpyxl",
    "pandas"
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    # <9.2 until pytest-xdist releases its fix for loadgroup under pytest 9.2
    # (pytest-dev/pytest-xdist#1386); without it every worker re-runs each migration
    "pytest>=9.0.0,<9.2",
    "pytest-github-actions-annotate-failures",
    "pytest-xdist>=3.0",
    "ruff>=0.15.2",
]

[project.urls]
Homepage = "https://github.com/EFRAG-EU/Digital-Template-Data-Migration-Tool"

[tool.hatch.build.targets.wheel]
packages = ["src/migration_tool"]

[tool.ruff]
extend-exclude = ["*.ipynb"]
 
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version comes from git (e.g. 0.1.5.dev49+gdb0b857), so every commit is a
# distinct version and moving a git pin always reinstalls.
[tool.hatch.version]
source = "vcs"
fallback-version = "0+unknown"

[tool.pytest.ini_options]
# Parallel by default, grouped by sample so each sample's expensive migration
# runs on a single worker (see tests/conftest.py). Use `-n0` for serial debugging.
addopts = "-n auto --dist loadgroup --durations=20"
markers = [
    "slow: marks tests that run migration multiple times (deselect with '-m \"not slow\"')",
]
